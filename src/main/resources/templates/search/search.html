<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Search Cars – Second Hand Car Platform</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',sans-serif;min-height:100vh;
        background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);color:#fff}

    /* ── Nav ── */
    nav{display:flex;align-items:center;justify-content:space-between;padding:1rem 2.5rem;
        background:rgba(255,255,255,.05);backdrop-filter:blur(12px);
        border-bottom:1px solid rgba(255,255,255,.1);position:sticky;top:0;z-index:10}
    .nav-brand{font-size:1.4rem;font-weight:700;
        background:linear-gradient(90deg,#a78bfa,#60a5fa);
        -webkit-background-clip:text;-webkit-text-fill-color:transparent;text-decoration:none}
    .nav-links{display:flex;gap:.8rem;align-items:center}
    .nav-links a{color:rgba(255,255,255,.65);text-decoration:none;font-size:.88rem;font-weight:500;
        padding:.45rem 1rem;border-radius:8px;transition:background .2s,color .2s}
    .nav-links a:hover{background:rgba(255,255,255,.1);color:#fff}
    .btn-logout{background:rgba(239,68,68,.15)!important;color:#fca5a5!important;border:1px solid rgba(239,68,68,.3)!important}

    /* ── Layout ── */
    .page-wrap{display:grid;grid-template-columns:280px 1fr;gap:1.8rem;
        max-width:1200px;margin:2.5rem auto;padding:0 1.5rem;align-items:start}
    @media(max-width:768px){.page-wrap{grid-template-columns:1fr}}

    /* ── Flash ── */
    .alert{padding:.75rem 1rem;border-radius:10px;margin-bottom:1rem;font-size:.875rem;font-weight:500}
    .alert-success{background:rgba(52,211,153,.15);color:#6ee7b7;border:1px solid rgba(52,211,153,.3)}

    /* ── Filter Panel ── */
    .filter-panel{background:rgba(255,255,255,.07);backdrop-filter:blur(14px);
        border:1px solid rgba(255,255,255,.13);border-radius:18px;padding:1.6rem;
        position:sticky;top:90px;animation:fadeUp .4s ease}
    @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
    .filter-panel h2{font-size:.9rem;font-weight:700;text-transform:uppercase;
        letter-spacing:.07em;color:rgba(255,255,255,.5);margin-bottom:1.2rem}
    .filter-group{margin-bottom:1.1rem}
    .filter-group label{display:block;font-size:.78rem;color:rgba(255,255,255,.55);
        font-weight:600;margin-bottom:.4rem;text-transform:uppercase;letter-spacing:.05em}
    input[type=text],input[type=number],select{width:100%;padding:.62rem .9rem;
        background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);
        border-radius:9px;color:#fff;font-size:.88rem;outline:none;
        font-family:inherit;transition:border-color .25s,box-shadow .25s}
    input::placeholder{color:rgba(255,255,255,.3)}
    input:focus,select:focus{border-color:#a78bfa;box-shadow:0 0 0 3px rgba(167,139,250,.18)}
    select option{background:#302b63;color:#fff}
    .price-row,.year-row{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}

    .btn-search{width:100%;padding:.72rem;background:linear-gradient(135deg,#a78bfa,#60a5fa);
        border:none;border-radius:10px;color:#fff;font-weight:700;font-size:.9rem;
        cursor:pointer;transition:opacity .2s;margin-top:.4rem}
    .btn-search:hover{opacity:.88}
    .btn-clear{width:100%;padding:.6rem;background:rgba(255,255,255,.07);
        border:1px solid rgba(255,255,255,.14);border-radius:10px;color:rgba(255,255,255,.55);
        font-size:.82rem;font-weight:600;cursor:pointer;margin-top:.5rem;transition:background .2s}
    .btn-clear:hover{background:rgba(255,255,255,.13);color:#fff}

    /* Save preference btn */
    .btn-save-pref{width:100%;padding:.6rem;background:rgba(167,139,250,.15);
        border:1px solid rgba(167,139,250,.3);border-radius:10px;color:#c4b5fd;
        font-size:.82rem;font-weight:600;cursor:pointer;margin-top:.5rem;transition:background .2s}
    .btn-save-pref:hover{background:rgba(167,139,250,.28)}

    /* ── Active filter chips ── */
    .active-filters{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:1.2rem}
    .chip{display:inline-flex;align-items:center;gap:.35rem;padding:.28rem .75rem;
        background:rgba(167,139,250,.18);border:1px solid rgba(167,139,250,.3);
        border-radius:999px;font-size:.77rem;color:#c4b5fd;font-weight:500}

    /* ── Results area ── */
    .results-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.2rem}
    .results-header h1{font-size:1.2rem;font-weight:700}
    .results-count{color:rgba(255,255,255,.45);font-size:.85rem}

    /* ── Car cards ── */
    .car-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1.3rem}
    .car-card{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.11);
        border-radius:14px;overflow:hidden;transition:transform .22s,box-shadow .22s}
    .car-card:hover{transform:translateY(-4px);box-shadow:0 14px 36px rgba(0,0,0,.32)}
    .card-header{padding:1rem 1.2rem .7rem;border-bottom:1px solid rgba(255,255,255,.07)}
    .card-type{font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;
        padding:.18rem .65rem;border-radius:999px;display:inline-block;margin-bottom:.45rem}
    .type-car {background:rgba(96,165,250,.2);color:#93c5fd}
    .type-used{background:rgba(251,191,36,.2);color:#fde68a}
    .type-cert{background:rgba(52,211,153,.2);color:#6ee7b7}
    .card-title{font-size:1rem;font-weight:700}
    .card-year{font-size:.8rem;color:rgba(255,255,255,.4);margin-top:.1rem}
    .card-body{padding:.9rem 1.2rem}
    .card-price{font-size:1.2rem;font-weight:700;color:#a78bfa;margin-bottom:.4rem}
    .card-cond{font-size:.8rem;color:rgba(255,255,255,.5)}
    .card-footer{padding:.7rem 1.2rem 1rem}
    .btn-view{display:block;text-align:center;padding:.55rem;border-radius:9px;
        background:linear-gradient(135deg,#a78bfa,#60a5fa);color:#fff;
        text-decoration:none;font-size:.83rem;font-weight:600;transition:opacity .2s}
    .btn-view:hover{opacity:.85}

    /* ── Empty state ── */
    .empty{text-align:center;padding:4rem 0;color:rgba(255,255,255,.3)}
    .empty p{margin-top:.4rem;font-size:.9rem}

    /* ── Saved Preferences ── */
    .saved-section{margin-top:2rem}
    .saved-section h2{font-size:.82rem;text-transform:uppercase;letter-spacing:.07em;
        color:rgba(255,255,255,.4);margin-bottom:.8rem;font-weight:600}
    .pref-item{display:flex;justify-content:space-between;align-items:center;
        background:rgba(255,255,255,.05);border-radius:10px;padding:.6rem .9rem;
        margin-bottom:.5rem;font-size:.82rem;gap:.5rem}
    .pref-text{color:rgba(255,255,255,.7);flex:1;word-break:break-word}
    .pref-actions{display:flex;gap:.4rem;flex-shrink:0}
    .pref-load{padding:.28rem .65rem;border-radius:7px;background:rgba(96,165,250,.2);
        color:#93c5fd;text-decoration:none;font-size:.77rem;font-weight:600;transition:background .2s}
    .pref-load:hover{background:rgba(96,165,250,.35)}
    .pref-del{padding:.28rem .65rem;border-radius:7px;background:rgba(239,68,68,.15);
        color:#fca5a5;border:none;cursor:pointer;font-size:.77rem;font-weight:600;transition:background .2s}
    .pref-del:hover{background:rgba(239,68,68,.3)}
    .btn-clear-all{font-size:.77rem;padding:.3rem .7rem;border-radius:7px;
        background:rgba(239,68,68,.1);color:#fca5a5;border:1px solid rgba(239,68,68,.25);
        cursor:pointer;transition:background .2s}
    .btn-clear-all:hover{background:rgba(239,68,68,.25)}
    .saved-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:.8rem}
  </style>
</head>
<body>

<nav>
  <a href="/cars" class="nav-brand">🚗 SecondHand Cars</a>
  <div class="nav-links">
    <a th:href="@{/cars}">All Listings</a>
    <a th:href="@{/profile}">👤 Profile</a>
    <a th:href="@{/logout}" class="btn-logout">⏻ Logout</a>
  </div>
</nav>

<div class="page-wrap">

  <!-- ══════════════════════════════════════════════════════ -->
  <!--  LEFT: Filter Panel                                    -->
  <!-- ══════════════════════════════════════════════════════ -->
  <aside>
    <div class="filter-panel">
      <h2>🔍 Search &amp; Filter</h2>

      <form id="filterForm" th:action="@{/search}" method="get">

        <!-- Keyword -->
        <div class="filter-group">
          <label for="keyword">Keyword</label>
          <input id="keyword" name="keyword" type="text"
                 th:value="${keyword}" placeholder="Brand, model…"/>
        </div>

        <!-- Brand dropdown -->
        <div class="filter-group">
          <label for="brand">Brand</label>
          <select id="brand" name="brand">
            <option value="">Any Brand</option>
            <option th:each="b : ${brands}"
                    th:value="${b}" th:text="${b}"
                    th:selected="${brand == b}">Brand</option>
          </select>
        </div>

        <!-- Price range -->
        <div class="filter-group">
          <label>Price Range (USD)</label>
          <div class="price-row">
            <input name="minPrice" type="number" placeholder="Min" min="0"
                   th:value="${minPrice != '' ? minPrice : ''}"/>
            <input name="maxPrice" type="number" placeholder="Max" min="0"
                   th:value="${maxPrice != '' ? maxPrice : ''}"/>
          </div>
        </div>

        <!-- Year range -->
        <div class="filter-group">
          <label>Year Range</label>
          <div class="year-row">
            <input name="fromYear" type="number" placeholder="From" min="1980" max="2030"
                   th:value="${fromYear != '' ? fromYear : ''}"/>
            <input name="toYear" type="number" placeholder="To" min="1980" max="2030"
                   th:value="${toYear != '' ? toYear : ''}"/>
          </div>
        </div>

        <!-- Type -->
        <div class="filter-group">
          <label for="type">Listing Type</label>
          <select id="type" name="type">
            <option value=""            th:selected="${type == ''}">Any Type</option>
            <option value="CAR"         th:selected="${type == 'CAR'}">New Car</option>
            <option value="USED_CAR"    th:selected="${type == 'USED_CAR'}">Used Car</option>
            <option value="CERTIFIED_CAR" th:selected="${type == 'CERTIFIED_CAR'}">Certified</option>
          </select>
        </div>

        <button type="submit" class="btn-search">Apply Filters</button>
        <a th:href="@{/search}" style="display:block">
          <button type="button" class="btn-clear">✕ Clear All Filters</button>
        </a>
      </form>

      <!-- Save current search -->
      <form th:action="@{/search/save}" method="post">
        <input type="hidden" name="keyword"  th:value="${keyword}"/>
        <input type="hidden" name="brand"    th:value="${brand}"/>
        <input type="hidden" name="minPrice" th:value="${minPrice}"/>
        <input type="hidden" name="maxPrice" th:value="${maxPrice}"/>
        <input type="hidden" name="fromYear" th:value="${fromYear}"/>
        <input type="hidden" name="toYear"   th:value="${toYear}"/>
        <input type="hidden" name="type"     th:value="${type}"/>
        <button type="submit" class="btn-save-pref">💾 Save This Search</button>
      </form>

      <!-- ── Saved Preferences ── -->
      <div class="saved-section" th:if="${savedPrefs != null and !savedPrefs.isEmpty()}">
        <div class="saved-header">
          <h2>📌 Saved Searches</h2>
          <form th:action="@{/search/prefs/clear}" method="post">
            <button type="submit" class="btn-clear-all">Clear All</button>
          </form>
        </div>
        <div th:each="pref : ${savedPrefs}" class="pref-item">
          <span class="pref-text" th:text="${pref.summary}">Filters</span>
          <div class="pref-actions">
            <a class="pref-load"
               th:href="@{/search(keyword=${pref.keyword},brand=${pref.brand},minPrice=${pref.minPrice},maxPrice=${pref.maxPrice},fromYear=${pref.fromYear},toYear=${pref.toYear},type=${pref.type})}">
              Load
            </a>
            <form th:action="@{/search/prefs/{id}/delete(id=${pref.prefId})}" method="post">
              <button type="submit" class="pref-del">✕</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </aside>

  <!-- ══════════════════════════════════════════════════════ -->
  <!--  RIGHT: Results                                        -->
  <!-- ══════════════════════════════════════════════════════ -->
  <section>
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

    <!-- Active filter chips -->
    <div class="active-filters" th:if="${!filters.isEmpty()}">
      <span th:each="f : ${filters}" class="chip">
        <span>🏷</span> <span th:text="${f}">filter</span>
      </span>
    </div>

    <div class="results-header">
      <h1>Search Results</h1>
      <span class="results-count" th:text="${results.size()} + ' car(s) found'">0 cars</span>
    </div>

    <!-- Car cards grid -->
    <div class="car-grid" th:if="${!results.isEmpty()}">
      <div class="car-card" th:each="car : ${results}">
        <div class="card-header">
          <span class="card-type"
                th:classappend="${car.type == 'USED_CAR'} ? 'type-used' : (${car.type == 'CERTIFIED_CAR'} ? 'type-cert' : 'type-car')"
                th:text="${car.type == 'USED_CAR'} ? 'Used' : (${car.type == 'CERTIFIED_CAR'} ? 'Certified' : 'New')">
          </span>
          <div class="card-title" th:text="${car.brand} + ' ' + ${car.model}">Car</div>
          <div class="card-year"  th:text="${car.year}">Year</div>
        </div>
        <div class="card-body">
          <div class="card-price" th:text="'$' + ${#numbers.formatDecimal(car.price,1,'COMMA',2,'POINT')}">Price</div>
          <div class="card-cond"  th:text="'Condition: ' + ${car.condition}">Cond</div>
        </div>
        <div class="card-footer">
          <a th:href="@{/cars/{id}(id=${car.carId})}" class="btn-view">View Details →</a>
        </div>
      </div>
    </div>

    <!-- Empty state -->
    <div class="empty" th:if="${results.isEmpty()}">
      <div style="font-size:2.8rem">🔍</div>
      <p>No cars match your filters. Try adjusting your search.</p>
    </div>
  </section>

</div>
</body>
</html>
