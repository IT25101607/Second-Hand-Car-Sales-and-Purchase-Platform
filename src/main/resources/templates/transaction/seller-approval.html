<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pending Approvals – Second Hand Car Platform</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',sans-serif;min-height:100vh;background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);color:#fff}
    nav{display:flex;align-items:center;justify-content:space-between;padding:1rem 2.5rem;
        background:rgba(255,255,255,.05);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.1);position:sticky;top:0;z-index:10}
    .nav-brand{font-size:1.4rem;font-weight:700;background:linear-gradient(90deg,#a78bfa,#60a5fa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-decoration:none}
    .nav-links{display:flex;gap:.8rem;align-items:center}
    .nav-links a{color:rgba(255,255,255,.65);text-decoration:none;font-size:.88rem;font-weight:500;padding:.45rem 1rem;border-radius:8px;transition:background .2s,color .2s}
    .nav-links a:hover{background:rgba(255,255,255,.1);color:#fff}

    main{max-width:860px;margin:2.5rem auto;padding:0 1.5rem}
    h1{font-size:1.5rem;font-weight:700;margin-bottom:.3rem}
    .subtitle{color:rgba(255,255,255,.45);font-size:.85rem;margin-bottom:2rem}

    .alert{padding:.75rem 1rem;border-radius:10px;margin-bottom:1.5rem;font-size:.875rem;font-weight:500}
    .alert-success{background:rgba(52,211,153,.15);color:#6ee7b7;border:1px solid rgba(52,211,153,.3)}
    .alert-error{background:rgba(239,68,68,.15);color:#fca5a5;border:1px solid rgba(239,68,68,.3)}

    /* Request cards */
    .request-list{display:flex;flex-direction:column;gap:1.2rem}
    .request-card{background:rgba(255,255,255,.07);backdrop-filter:blur(14px);
        border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:1.5rem 1.8rem;
        animation:fadeUp .4s ease;transition:box-shadow .2s}
    .request-card:hover{box-shadow:0 12px 35px rgba(0,0,0,.3)}
    @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

    .req-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:1rem;flex-wrap:wrap;gap:.5rem}
    .badge-pending{display:inline-block;padding:.22rem .8rem;border-radius:999px;
        font-size:.74rem;font-weight:700;text-transform:uppercase;
        background:rgba(251,191,36,.2);color:#fde68a;border:1px solid rgba(251,191,36,.3)}
    .txn-id{font-size:.75rem;color:rgba(255,255,255,.35);font-family:monospace;margin-top:.2rem}

    .info-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:1rem;margin-bottom:1.2rem}
    .info-item label{font-size:.72rem;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:.25rem}
    .info-item p{font-size:.9rem;font-weight:500}
    .price-val{color:#a78bfa;font-weight:700;font-size:1.05rem}

    /* Buyer info row */
    .buyer-row{display:flex;align-items:center;gap:.9rem;background:rgba(255,255,255,.05);
        border-radius:10px;padding:.75rem 1rem;margin-bottom:1rem}
    .buyer-avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#60a5fa,#a78bfa);
        display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0}
    .buyer-name{font-weight:600;font-size:.9rem}
    .buyer-email{font-size:.78rem;color:rgba(255,255,255,.45)}

    /* Message */
    .req-message{background:rgba(255,255,255,.05);border-radius:10px;padding:.75rem 1rem;margin-bottom:1.2rem}
    .req-message strong{font-size:.72rem;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:.3rem}
    .req-message p{font-size:.87rem;color:rgba(255,255,255,.7);line-height:1.5}

    /* Approve/Reject buttons */
    .action-row{display:flex;gap:.9rem}
    .btn{flex:1;padding:.72rem;border-radius:11px;border:none;font-size:.9rem;font-weight:600;cursor:pointer;transition:all .2s;text-align:center}
    .btn-approve{background:linear-gradient(135deg,#34d399,#059669);color:#fff}
    .btn-approve:hover{opacity:.88;transform:translateY(-1px)}
    .btn-reject{background:rgba(239,68,68,.15);color:#fca5a5;border:1px solid rgba(239,68,68,.3)}
    .btn-reject:hover{background:rgba(239,68,68,.28);transform:translateY(-1px)}

    /* Poly box */
    .poly-box{background:rgba(167,139,250,.07);border:1px solid rgba(167,139,250,.18);border-radius:9px;
        padding:.6rem .9rem;font-size:.77rem;color:rgba(255,255,255,.5);font-family:monospace;margin-bottom:1rem;word-break:break-all}
    .poly-box strong{color:#c4b5fd;font-family:'Inter',sans-serif;font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:.2rem}

    /* Empty */
    .empty{text-align:center;padding:5rem 0;color:rgba(255,255,255,.3)}
    .empty p{margin-top:.4rem;font-size:.9rem}

    /* Stats banner */
    .stats-banner{display:flex;gap:1rem;margin-bottom:2rem;flex-wrap:wrap}
    .stat-card{flex:1;min-width:140px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);
        border-radius:14px;padding:1.1rem 1.4rem;text-align:center}
    .stat-num{font-size:2rem;font-weight:700;color:#a78bfa}
    .stat-label{font-size:.78rem;color:rgba(255,255,255,.45);margin-top:.2rem}
  </style>
</head>
<body>
<nav>
  <a href="/cars" class="nav-brand">🚗 SecondHand Cars</a>
  <div class="nav-links">
    <a th:href="@{/transactions/history}">📋 My Sales</a>
    <a th:href="@{/cars/my}">🚗 My Listings</a>
    <a th:href="@{/profile}">👤 Profile</a>
    <a th:href="@{/logout}">⏻ Logout</a>
  </div>
</nav>

<main>
  <h1>⏳ Pending Purchase Requests</h1>
  <p class="subtitle" th:text="'Hello ' + ${seller.name} + ' – ' + ${pending.size()} + ' request(s) awaiting your decision'">Subtitle</p>

  <!-- Stats banner -->
  <div class="stats-banner">
    <div class="stat-card">
      <div class="stat-num" th:text="${pending.size()}">0</div>
      <div class="stat-label">Pending Requests</div>
    </div>
  </div>

  <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
  <div th:if="${error}"   class="alert alert-error"   th:text="${error}"></div>

  <!-- Request cards -->
  <div class="request-list" th:if="${!pending.isEmpty()}">
    <div class="request-card" th:each="txn : ${pending}">

      <!-- Header -->
      <div class="req-header">
        <div>
          <span class="badge-pending">⏳ Pending</span>
          <div class="txn-id" th:text="'Request #' + ${txn.txnId}">ID</div>
        </div>
        <span style="font-size:.8rem;color:rgba(255,255,255,.4)" th:text="${txn.createdAt}">Date</span>
      </div>

      <!-- Car info -->
      <div class="info-grid" th:with="car=${carMap[txn.carId]}">
        <div class="info-item">
          <label>Car</label>
          <p th:text="${car != null} ? (${car.brand} + ' ' + ${car.model}) : txn.carId">—</p>
        </div>
        <div class="info-item">
          <label>Year</label>
          <p th:text="${car != null} ? ${car.year} : '—'">—</p>
        </div>
        <div class="info-item">
          <label>Offer Amount</label>
          <p class="price-val" th:text="'$' + ${#numbers.formatDecimal(txn.amount,1,'COMMA',2,'POINT')}">$0</p>
        </div>
        <div class="info-item">
          <label>Date</label>
          <p th:text="${txn.createdAt}">—</p>
        </div>
      </div>

      <!-- Buyer info -->
      <div class="buyer-row" th:with="buyer=${buyerMap[txn.buyerId]}">
        <div class="buyer-avatar" th:text="${buyer != null} ? ${#strings.substring(buyer.name,0,1)} : 'B'">B</div>
        <div>
          <div class="buyer-name" th:text="${buyer != null} ? ${buyer.name} : txn.buyerId">Buyer</div>
          <div class="buyer-email" th:text="${buyer != null} ? ${buyer.email} : ''">email</div>
        </div>
      </div>

      <!-- Polymorphic getSummary() -->
      <div class="poly-box">
        <strong>🧬 getSummary() — Polymorphic output</strong>
        <span th:text="${txn.summary}">—</span>
      </div>

      <!-- Buyer message -->
      <div class="req-message" th:if="${txn.message != null and !txn.message.isBlank()}">
        <strong>Buyer's message</strong>
        <p th:text="${txn.message}">—</p>
      </div>

      <!-- Approve / Reject -->
      <div class="action-row">
        <form th:action="@{/transactions/{id}/approve(id=${txn.txnId})}" method="post">
          <button type="submit" class="btn btn-approve">✅ Approve</button>
        </form>
        <form th:action="@{/transactions/{id}/reject(id=${txn.txnId})}" method="post">
          <button type="submit" class="btn btn-reject">❌ Reject</button>
        </form>
      </div>
    </div>
  </div>

  <div class="empty" th:if="${pending.isEmpty()}">
    <div style="font-size:2.8rem">🎉</div>
    <p>No pending requests — you're all caught up!</p>
  </div>
</main>
</body>
</html>
