<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Buy Request – Second Hand Car Platform</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',sans-serif;min-height:100vh;
        background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);color:#fff}
    nav{display:flex;align-items:center;justify-content:space-between;padding:1rem 2.5rem;
        background:rgba(255,255,255,.05);backdrop-filter:blur(12px);
        border-bottom:1px solid rgba(255,255,255,.1);position:sticky;top:0;z-index:10}
    .nav-brand{font-size:1.4rem;font-weight:700;background:linear-gradient(90deg,#a78bfa,#60a5fa);
        -webkit-background-clip:text;-webkit-text-fill-color:transparent;text-decoration:none}
    .nav-links a{color:rgba(255,255,255,.65);text-decoration:none;font-size:.88rem;font-weight:500;
        padding:.45rem 1rem;border-radius:8px;transition:background .2s,color .2s}
    .nav-links a:hover{background:rgba(255,255,255,.1);color:#fff}
    main{max-width:600px;margin:3rem auto;padding:0 1.5rem}
    .card{background:rgba(255,255,255,.07);backdrop-filter:blur(18px);
        border:1px solid rgba(255,255,255,.15);border-radius:20px;padding:2.5rem;
        box-shadow:0 20px 50px rgba(0,0,0,.35);animation:fadeUp .45s ease}
    @keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

    /* Car summary box */
    .car-summary{background:rgba(167,139,250,.1);border:1px solid rgba(167,139,250,.25);
        border-radius:14px;padding:1.3rem 1.5rem;margin-bottom:2rem}
    .car-summary h2{font-size:1.2rem;font-weight:700;margin-bottom:.5rem}
    .car-meta{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-top:.8rem}
    .meta-item label{font-size:.73rem;color:rgba(255,255,255,.4);text-transform:uppercase;
        letter-spacing:.05em;display:block;margin-bottom:.2rem}
    .meta-item p{font-size:.9rem;font-weight:500}
    .price-big{font-size:1.6rem;font-weight:700;color:#a78bfa;margin-top:.6rem}

    /* Seller info */
    .seller-box{background:rgba(255,255,255,.05);border-radius:10px;
        padding:.8rem 1rem;margin-bottom:1.8rem;display:flex;align-items:center;gap:1rem}
    .seller-avatar{width:42px;height:42px;border-radius:50%;
        background:linear-gradient(135deg,#a78bfa,#60a5fa);
        display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0}
    .seller-name{font-weight:600;font-size:.92rem}
    .seller-email{font-size:.8rem;color:rgba(255,255,255,.45);margin-top:.1rem}

    h1{font-size:1.4rem;font-weight:700;margin-bottom:.4rem}
    .subtitle{color:rgba(255,255,255,.45);font-size:.85rem;margin-bottom:1.8rem}

    .form-group{margin-bottom:1.2rem}
    label.field-label{display:block;color:rgba(255,255,255,.65);font-size:.82rem;
        margin-bottom:.4rem;font-weight:500}
    textarea{width:100%;padding:.75rem 1rem;background:rgba(255,255,255,.08);
        border:1px solid rgba(255,255,255,.18);border-radius:10px;color:#fff;
        font-size:.9rem;outline:none;font-family:inherit;resize:vertical;min-height:100px;
        transition:border-color .25s,box-shadow .25s}
    textarea::placeholder{color:rgba(255,255,255,.3)}
    textarea:focus{border-color:#a78bfa;box-shadow:0 0 0 3px rgba(167,139,250,.2)}

    /* Confirm checkbox */
    .confirm-box{display:flex;gap:.8rem;align-items:flex-start;
        background:rgba(52,211,153,.08);border:1px solid rgba(52,211,153,.2);
        border-radius:12px;padding:1rem;margin-bottom:1.4rem}
    .confirm-box input[type=checkbox]{margin-top:.15rem;width:16px;height:16px;
        accent-color:#a78bfa;flex-shrink:0}
    .confirm-box p{font-size:.83rem;color:rgba(255,255,255,.7);line-height:1.5}
    .confirm-box strong{color:#6ee7b7}

    .btn-row{display:flex;gap:1rem}
    .btn{flex:1;padding:.8rem;border-radius:12px;border:none;font-size:.95rem;
        font-weight:600;cursor:pointer;transition:all .2s;text-align:center;
        text-decoration:none;display:inline-block}
    .btn-primary{background:linear-gradient(135deg,#a78bfa,#60a5fa);color:#fff}
    .btn-primary:hover{opacity:.88;transform:translateY(-1px)}
    .btn-cancel{background:rgba(255,255,255,.08);color:rgba(255,255,255,.65);
        border:1px solid rgba(255,255,255,.14)}
    .btn-cancel:hover{background:rgba(255,255,255,.14);color:#fff}
  </style>
</head>
<body>
<nav>
  <a href="/cars" class="nav-brand">🚗 SecondHand Cars</a>
  <div class="nav-links">
    <a th:href="@{/cars/{id}(id=${car.carId})}">← Back to Listing</a>
  </div>
</nav>
<main>
  <div class="card">
    <h1>🛒 Send Purchase Request</h1>
    <p class="subtitle">Submit a request to the seller. They will review and approve or reject it.</p>

    <!-- Car summary -->
    <div class="car-summary">
      <h2 th:text="${car.brand} + ' ' + ${car.model}">Car</h2>
      <div class="car-meta">
        <div class="meta-item"><label>Year</label><p th:text="${car.year}">—</p></div>
        <div class="meta-item"><label>Condition</label><p th:text="${car.condition}">—</p></div>
        <div class="meta-item"><label>Type</label>
          <p th:text="${car.type == 'USED_CAR'} ? 'Used' : (${car.type == 'CERTIFIED_CAR'} ? 'Certified' : 'New')">—</p>
        </div>
        <div class="meta-item"><label>Car ID</label><p th:text="${car.carId}">—</p></div>
      </div>
      <div class="price-big" th:text="'$' + ${#numbers.formatDecimal(car.price,1,'COMMA',2,'POINT')}">Price</div>
    </div>

    <!-- Seller info -->
    <div class="seller-box" th:if="${seller != null}">
      <div class="seller-avatar" th:text="${#strings.substring(seller.name,0,1)}">S</div>
      <div>
        <div class="seller-name" th:text="'Seller: ' + ${seller.name}">Seller</div>
        <div class="seller-email" th:text="${seller.email}">email</div>
      </div>
    </div>

    <!-- Form -->
    <form th:action="@{/transactions/buy/{id}(id=${car.carId})}" method="post">
      <div class="form-group">
        <label class="field-label" for="message">Message to Seller (optional)</label>
        <textarea id="message" name="message"
                  placeholder="Hi, I'm interested in this car. Is it still available?"></textarea>
      </div>

      <div class="confirm-box">
        <input type="checkbox" id="confirm" required/>
        <p>I confirm that I want to send a purchase request for
          <strong th:text="${car.brand} + ' ' + ${car.model}">this car</strong> at the listed price of
          <strong th:text="'$' + ${#numbers.formatDecimal(car.price,1,'COMMA',2,'POINT')}">$0</strong>.
        </p>
      </div>

      <div class="btn-row">
        <a th:href="@{/cars/{id}(id=${car.carId})}" class="btn btn-cancel">Cancel</a>
        <button type="submit" class="btn btn-primary">Send Request 🚀</button>
      </div>
    </form>
  </div>
</main>
</body>
</html>
