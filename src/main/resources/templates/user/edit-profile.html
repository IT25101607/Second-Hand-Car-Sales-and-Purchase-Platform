<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edit Profile – Second Hand Car Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      color: #fff;
    }

    nav {
      display: flex; align-items: center; justify-content: space-between;
      padding: 1rem 2.5rem;
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255,255,255,0.1);
      position: sticky; top: 0; z-index: 10;
    }
    .nav-brand {
      font-size: 1.4rem; font-weight: 700;
      background: linear-gradient(90deg, #a78bfa, #60a5fa);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      text-decoration: none;
    }
    .nav-links a {
      color: rgba(255,255,255,0.65); text-decoration: none;
      font-size: 0.88rem; font-weight: 500; padding: 0.45rem 1rem;
      border-radius: 8px; transition: background 0.2s, color 0.2s;
    }
    .nav-links a:hover { background: rgba(255,255,255,0.1); color: #fff; }

    main { max-width: 520px; margin: 3rem auto; padding: 0 1.5rem; }

    .card {
      background: rgba(255,255,255,0.07);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 20px;
      padding: 2.5rem 2.8rem;
      box-shadow: 0 20px 50px rgba(0,0,0,0.35);
      animation: fadeUp 0.45s ease;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    h1 { font-size: 1.4rem; font-weight: 700; margin-bottom: 0.4rem; }
    .subtitle { color: rgba(255,255,255,0.45); font-size: 0.85rem; margin-bottom: 1.8rem; }

    .alert {
      padding: 0.75rem 1rem; border-radius: 10px; margin-bottom: 1.2rem;
      font-size: 0.875rem; font-weight: 500;
    }
    .alert-error   { background: rgba(239,68,68,0.15);  color: #fca5a5; border: 1px solid rgba(239,68,68,0.3); }
    .alert-success { background: rgba(52,211,153,0.15); color: #6ee7b7; border: 1px solid rgba(52,211,153,0.3); }

    .form-group { margin-bottom: 1.2rem; }
    label { display: block; color: rgba(255,255,255,0.65); font-size: 0.82rem; margin-bottom: 0.4rem; font-weight: 500; }
    .hint { font-size: 0.75rem; color: rgba(255,255,255,0.35); margin-top: 0.3rem; }

    input {
      width: 100%; padding: 0.75rem 1rem;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 10px; color: #fff; font-size: 0.93rem;
      outline: none; transition: border-color 0.25s, box-shadow 0.25s;
      font-family: inherit;
    }
    input:disabled {
      opacity: 0.4; cursor: not-allowed;
    }
    input::placeholder { color: rgba(255,255,255,0.3); }
    input:focus {
      border-color: #a78bfa;
      box-shadow: 0 0 0 3px rgba(167,139,250,0.2);
    }

    .btn-row { display: flex; gap: 1rem; margin-top: 0.5rem; }
    .btn {
      flex: 1; padding: 0.8rem; border-radius: 12px; border: none;
      font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: all 0.2s;
      text-align: center; text-decoration: none; display: inline-block;
    }
    .btn-primary { background: linear-gradient(135deg, #a78bfa, #60a5fa); color: #fff; }
    .btn-primary:hover { opacity: 0.88; transform: translateY(-1px); }
    .btn-cancel { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.65); border: 1px solid rgba(255,255,255,0.15); }
    .btn-cancel:hover { background: rgba(255,255,255,0.14); color: #fff; }
  </style>
</head>
<body>

<nav>
  <a th:href="@{/profile}" class="nav-brand">🚗 SecondHand Cars</a>
  <div class="nav-links">
    <a th:href="@{/profile}">← Back to Profile</a>
  </div>
</nav>

<main>
  <div class="card">
    <h1>Edit Profile</h1>
    <p class="subtitle">Update your personal information below.</p>

    <div th:if="${error}"   class="alert alert-error"   th:text="${error}"></div>
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

    <form th:action="@{/profile/edit}" method="post">

      <!-- Read-only fields -->
      <div class="form-group">
        <label for="userId">User ID</label>
        <input id="userId" type="text" th:value="${user.userId}" disabled />
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input id="email" type="email" th:value="${user.email}" disabled />
        <p class="hint">Email cannot be changed.</p>
      </div>

      <!-- Editable fields -->
      <div class="form-group">
        <label for="name">Full Name</label>
        <input id="name" name="name" type="text"
               th:value="${user.name}" placeholder="Your full name" required />
      </div>

      <div class="form-group">
        <label for="phone">Phone Number</label>
        <input id="phone" name="phone" type="tel"
               th:value="${user.phone}" placeholder="+94 71 234 5678" required />
      </div>

      <div class="form-group">
        <label for="password">New Password</label>
        <input id="password" name="password" type="password"
               placeholder="Leave blank to keep current password" minlength="6" />
        <p class="hint">Min. 6 characters. Leave empty to keep your current password.</p>
      </div>

      <div class="btn-row">
        <a th:href="@{/profile}" class="btn btn-cancel">Cancel</a>
        <button type="submit" class="btn btn-primary">Save Changes</button>
      </div>

    </form>
  </div>
</main>

</body>
</html>
